services:
  catalogdb:
    image: mongo
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  basketdb:
   container_name: basketdb
   restart: always
   ports:
    - "27019:27017"

  discountdb:
   image: postgres:17
   environment:
    - POSTGRES_DB=DiscountOnixDb
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=Ahmed!!
   ports:
    - "5433:5432"
   volumes:
    - discount_db_data:/var/lib/postgresql/data

  orderdb:
   image: mcr.microsoft.com/mssql/server:2022-latest
   container_name: orderdb
   environment:
    - SA_PASSWORD=StrongPassword123!
    - ACCEPT_EULA=Y
    - MSSQL_PID=Developer
   restart: always
   ports:
    - "1433:1433"
   volumes:
    - orderdb-data:/var/opt/mssql
   healthcheck:
    test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'StrongPassword123!' -C -Q 'select 1'"]
    interval: 10s
    timeout: 10s
    retries: 30
    start_period: 30s


  rabbitmq:
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"

  catalog.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "DatabaseSettings__ConnectionString=mongodb://catalogdb:27017"
      - "DatabaseSettings__DatabaseName=CatalogDb"
      - "DatabaseSettings__ProductCollectionName=Products"
      - "DatabaseSettings__BrandCollectionName=Brands"
      - "DatabaseSettings__TypeCollectionName=Types"
    depends_on:
      - catalogdb
    ports:
      - "8003:8080"

  basket:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "CacheSettings__ConnectionString=basketdb:6379"
      - "GrpcSettings__DiscountUrl=http://discount:8080"
      - "EventBusSettings__HostAddress=amqp://guest:guest@rabbitmq:5672/"
    depends_on:
      - basketdb
      - rabbitmq
    ports:
      - "8004:8080"
  discount:
   environment:
    - ASPNETCORE_ENVIRONMENT=Development
    - DatabaseSettings__ConnectionString=Host=discountdb;Port=5432;Database=DiscountOnixDb;Username=postgres;Password=Ahmed!!;
   depends_on:
    - discountdb
   ports:
    - "8005:8080"

  ordering.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__OrderingConnectionString=Server=orderdb,1433;Database=OrderDb;User Id=sa;Password=StrongPassword123!;TrustServerCertificate=True;Encrypt=False;
      - EventBusSettings__HostAddress=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_started
      orderdb:
        condition: service_healthy
    ports:
      - "8006:8080"

  payment:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "EventBusSettings__HostAddress=amqp://guest:guest@rabbitmq:5672/"  
      - "ElasticConfiguration__Uri=http://elasticsearch:9200"  
    ports:
      - "8007:8080"

  ocelot.apigateway:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "Jwt__Key=super_secure_secret_key_1234567890!@#"
      - "Jwt__Issuer=ecommerce.identity"
      - "Jwt__Audience=ecommerce.clients"
    depends_on:
      - catalog.api
      # - basket
      # - ordering
      # - payment
      # - discount
    ports:
      - "8010:8080"

volumes:
  mongo_data:
  discount_db_data:
  orderdb-data: